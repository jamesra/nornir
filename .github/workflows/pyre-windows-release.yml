name: Pyre Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML for release scripts
        run: python -m pip install --upgrade pip pyyaml

      - name: Verify package versions
        run: python release/verify_package_versions.py

      - name: Read monorepo version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Invalid VERSION: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./nornir-pyre/packaging/windows/build-freeze.ps1 -SkipVerify

      - name: Smoke test frozen bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./nornir-pyre/packaging/windows/validate-frozen.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            nornir-pyre/packaging/windows/pyre-installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyre-windows-installer
          path: nornir-pyre/packaging/windows/dist/installer/Pyre-*.exe

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nornir-pyre/packaging/windows/dist/installer/Pyre-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
