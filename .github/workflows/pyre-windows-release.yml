# Build the Pyre Windows installer, publish to GitHub Releases (pyre-<ver>),
# attach curated user changelog notes, and refresh documentation.
#
# Tags:
#   pyre-*  — dedicated Windows installer releases (preferred; marked latest)
#   v*      — monorepo release tags; also publishes under pyre-<pyre-version>
# workflow_dispatch — build/publish without pushing a tag first
#
# Assets on each pyre-<ver> release:
#   Pyre-<ver>-Setup.exe  — versioned (history)
#   Pyre-Setup.exe        — stable name for:
#     https://github.com/jamesra/nornir/releases/latest/download/Pyre-Setup.exe
#
# Notes come from nornir-pyre/CHANGELOG.user.md (## <ver> section).

name: Pyre Windows Release

on:
  push:
    tags:
      - "pyre-*"
      - "v*"
  workflow_dispatch:
    inputs:
      skip_docs_trigger:
        description: "Skip triggering the Documentation workflow after publish"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML for release scripts
        run: python -m pip install --upgrade pip pyyaml

      - name: Verify package versions
        run: python release/verify_package_versions.py

      - name: Read Pyre version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from release.sync_pyre_user_changelog import read_pyre_version; print(read_pyre_version())"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=pyre-$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Pyre version=$v tag=pyre-$v"

      # publish_pyre_windows_release.ps1 creates the pyre-<ver> tag after uploading a local
      # build. Without this guard that tag push rebuilt whatever commit the tag landed on
      # (once: old master, Pyre 1.8.4) and published it, possibly as latest.
      - name: Skip when the tag does not match or the release is already published
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          $skip = $false
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("pyre-") -and "${{ github.ref_name }}" -ne $tag) {
            Write-Host "::notice::Tag ${{ github.ref_name }} is on a commit whose pyproject says Pyre $ver; not building."
            $skip = $true
          }
          if (-not $skip -and "${{ github.event_name }}" -ne "workflow_dispatch") {
            $assets = gh release view $tag --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>$null
            if ($LASTEXITCODE -eq 0 -and ($assets -contains "Pyre-$ver-Setup.exe")) {
              Write-Host "::notice::Release $tag already has Pyre-$ver-Setup.exe (published locally); not rebuilding."
              $skip = $true
            }
          }
          "skip=$($skip.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build PyInstaller bundle
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./nornir-pyre/packaging/windows/build-freeze.ps1 -SkipVerify

      - name: Smoke test frozen bundle
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./nornir-pyre/packaging/windows/validate-frozen.ps1

      - name: Install Inno Setup
        if: steps.guard.outputs.skip != 'true'
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./nornir-pyre/packaging/windows/build-installer.ps1

      - name: Prepare assets and release notes
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $dir = "nornir-pyre/packaging/windows/dist/installer"
          $versioned = Join-Path $dir "Pyre-$ver-Setup.exe"
          if (-not (Test-Path $versioned)) { throw "Missing $versioned" }
          Copy-Item -Force $versioned (Join-Path $dir "Pyre-Setup.exe")
          python release/sync_pyre_user_changelog.py `
            --version $ver `
            --notes-file release/_pyre_release_notes.md `
            --write-docs

      - name: Upload installer artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pyre-windows-installer
          path: |
            nornir-pyre/packaging/windows/dist/installer/Pyre-*-Setup.exe
            nornir-pyre/packaging/windows/dist/installer/Pyre-Setup.exe

      - name: Publish GitHub Release (pyre-*)
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pyre ${{ steps.ver.outputs.version }} Windows installer
          body_path: release/_pyre_release_notes.md
          files: |
            nornir-pyre/packaging/windows/dist/installer/Pyre-${{ steps.ver.outputs.version }}-Setup.exe
            nornir-pyre/packaging/windows/dist/installer/Pyre-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger documentation deploy
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_docs_trigger) }}
        shell: pwsh
        run: |
          gh workflow run docs.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
