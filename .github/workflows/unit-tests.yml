# Non-data unit tests across Nornir packages in the monorepo.
# Does not fetch nornir-testdata, CuPy, or INPUT_NORNIR_DATA corpora.

name: Unit tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  NORNIR_HEADLESS: "1"
  CURSES: "False"
  TERM: xterm

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create empty test data directories
        run: |
          mkdir -p "${{ github.workspace }}/testdata" "${{ github.workspace }}/testdata_output"
          echo "TESTINPUTPATH=${{ github.workspace }}/testdata" >> "$GITHUB_ENV"
          echo "TESTOUTPUTPATH=${{ github.workspace }}/testdata_output" >> "$GITHUB_ENV"

      - name: Install Nornir packages from the monorepo
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e nornir-shared
          python -m pip install -e nornir-pools --no-deps
          python -m pip install "six>=1.16" "numpy>=1.26" "matplotlib>=3.8"
          python -m pip install -e nornir-imageregistration --no-deps
          python -m pip install "scipy>=1.11" "Pillow>=10.2" "pydantic>=2.9.2" "scikit-image>=0.25.1" "hypothesis>=6.96"
          python -m pip install -e nornir-buildmanager --no-deps
          python -m pip install "validators>=0.23" "python-dotenv>=1.0.1"

      - name: Run non-data unit tests
        run: >
          python -m pytest -q
          nornir-shared/tests/test_Histogram.py
          nornir-shared/tests/test_Checksum.py
          nornir-shared/tests/test_files.py
          nornir-shared/tests/test_argparse_helpers.py
          nornir-shared/tests/test_console.py
          nornir-shared/tests/test_mqtt_config.py
          nornir-pools/tests/
          nornir-imageregistration/tests/test_grid_division.py
          nornir-imageregistration/tests/spatial/
          nornir-imageregistration/tests/test_stosfile_paths.py
          nornir-imageregistration/tests/test_gen_random_data_dtype.py
          nornir-imageregistration/tests/test_tile_overlap.py
          nornir-imageregistration/tests/test_transformed_image_data_contracts.py
          nornir-imageregistration/tests/test_assemble_phase2.py
          nornir-imageregistration/tests/test_assemble_preload.py
          nornir-imageregistration/tests/test_volume.py
          nornir-imageregistration/tests/transforms/test_registrationtree.py
          nornir-imageregistration/tests/transforms/test_points_to_linear_fit.py
          nornir-imageregistration/tests/transforms/test_linearfit.py
          nornir-imageregistration/tests/transforms/test_transform_conversion.py
          nornir-imageregistration/tests/transforms/test_scale_translate_registration.py
          nornir-buildmanager/tests/pipeline/test_pipelinemanager.py
          nornir-buildmanager/tests/pipeline/test_iterate_filters.py
          nornir-buildmanager/tests/pipeline/test_argparsexml.py
          nornir-buildmanager/tests/pipeline/test_build_early_meta.py
          nornir-buildmanager/tests/pipeline/test_audit_regressions.py
          nornir-buildmanager/tests/pipeline/test_sync_validation_times.py
          nornir-buildmanager/tests/pipeline/test_migration.py
          nornir-buildmanager/tests/validation/test_validation.py
          nornir-buildmanager/tests/importers/test_shared.py
