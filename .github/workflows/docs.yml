# Build the umbrella Sphinx monodoc and optionally push HTML to github.com/nornir/nornir.github.io
# See docs/development/publishing_documentation.rst for secret setup.

name: Documentation

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "VERSION"
      - "nornir-shared/**"
      - "nornir-pools/**"
      - "nornir-imageregistration/**"
      - "nornir-buildmanager/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Install Nornir packages from the monorepo
        run: |
          python -m pip install -e nornir-shared
          python -m pip install -e nornir-pools --no-deps
          python -m pip install "six>=1.16" "numpy>=1.26" "matplotlib>=3.8"
          python -m pip install -e nornir-imageregistration --no-deps
          python -m pip install "scipy>=1.11" "Pillow>=10.2" "pydantic>=2.9.2" "scikit-image>=0.25.1" "hypothesis>=6.96"
          python -m pip install -e nornir-buildmanager --no-deps
          python -m pip install "validators>=0.23" "python-dotenv>=1.0.1"

      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload HTML artifact
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html

  deploy:
    needs: build
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: html

      - name: Publish to nornir.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.NORNIR_GITHUB_IO_DEPLOY_TOKEN }}
          external_repository: nornir/nornir.github.io
          publish_branch: main
          publish_dir: ./html
          enable_jekyll: false
