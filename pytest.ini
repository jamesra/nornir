[pytest]
markers =
    graphical: requires PyQt/OpenGL/display; deselect with ``-m "not graphical"`` in headless stacks. nornir-pyre Qt driver scripts under ``nornir-pyre/tests/`` are excluded from collection via ``nornir-pyre/conftest.py`` (see ``docs/docker/cursor_dev.rst``).
    slow: measured to need far longer than a routine-verification budget; deselect with ``-m "not slow"``. Applied only from measurement, not suspicion -- see ``tests/test_SliceToSliceBrute_budget.py``. Was already in use in ``test_refine_single_pass.py`` while undeclared, which made it a silent PytestUnknownMarkWarning that filtered nothing.
    gpu: needs a real CUDA device, not just an importable CuPy; deselect with ``-m "not gpu"``. Distinct from a ``HasCupy()`` skip guard, which cannot tell "no GPU here" from "GPU busy": concurrent test jobs contend for one device, so a parallel runner needs to deselect these up front rather than discover the contention at runtime. Declared for chunked runs to apply; not yet attached to tests.
    needs_data: needs the external test-input corpus (``TESTINPUTPATH``, mounted at ``/nornir-testdata``); deselect with ``-m "not needs_data"``. Declared from measurement: with that mount empty, 125 tests failed as missing-input errors rather than skips, which is indistinguishable from a real regression in a baseline. Not yet attached to tests.
# Monorepo: Test Explorer / pytest collect from the umbrella folder must resolve
# sibling packages and test helpers (e.g. import setup_imagetest).
# importlib avoids sys.modules collisions when multiple subprojects expose similar layouts.
addopts = --import-mode=importlib
pythonpath =
    nornir-buildmanager
    nornir-imageregistration
    nornir-imageregistration/tests
    nornir-pools
    nornir-shared
    nornir-pyre
    nornir-volumecontroller
    nornir-volumemodel
# nornir-buildmanager tests live under tests/ so the Python package name is "tests".
# Do not list the whole nornir-buildmanager tree without tests/ on pythonpath.
# dm4 is omitted from umbrella testpaths (optional local runs: pytest dm4/tests -c /dev/null from dm4).
# nornir-web needs Django and settings; omit from umbrella discovery.
testpaths =
    nornir-buildmanager/tests
    nornir-imageregistration
    nornir-pools
    nornir-pyre
    nornir-shared
    nornir-volumecontroller
