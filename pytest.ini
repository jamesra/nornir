[pytest]
markers =
    graphical: requires PyQt/OpenGL/display; deselect with ``-m "not graphical"`` in headless stacks. nornir-pyre Qt driver scripts under ``nornir-pyre/tests/`` are excluded from collection via ``nornir-pyre/conftest.py`` (see ``docs/docker/cursor_dev.rst``).
# Monorepo: Test Explorer / pytest collect from the umbrella folder must resolve
# sibling packages and test helpers (e.g. import setup_imagetest).
# importlib avoids sys.modules collisions when multiple subprojects expose similar layouts.
addopts = --import-mode=importlib
pythonpath =
    nornir-buildmanager
    nornir-imageregistration
    nornir-imageregistration/tests
    nornir-pools
    nornir-shared
    nornir-pyre
    nornir-volumecontroller
    nornir-volumemodel
# nornir-buildmanager tests live under tests/ so the Python package name is "tests".
# Do not list the whole nornir-buildmanager tree without tests/ on pythonpath.
# dm4 is omitted from umbrella testpaths (optional local runs: pytest dm4/tests -c /dev/null from dm4).
# nornir-web needs Django and settings; omit from umbrella discovery.
testpaths =
    nornir-buildmanager/tests
    nornir-imageregistration
    nornir-pools
    nornir-pyre
    nornir-shared
    nornir-volumecontroller
